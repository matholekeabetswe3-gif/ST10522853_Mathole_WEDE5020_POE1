<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kgotso Foundation - Enquiry</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background-color: #FFF0F5; font-family: Arial, sans-serif; margin: 0; padding: 0;">

    <h1>Enquiry Form</h1>
    <p>Please fill in the form below and we will get back to you.</p>

    <form action="#" method="post">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your name" required><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email address" required><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required><br><br>

        <label for="enquiry-type">Enquiry Type:</label><br>
        <select id="enquiry-type" name="enquiry-type" required>
            <option value="">-- Please select --</option>
            <option value="general">General enquiry</option>
            <option value="support">Request for Support</option>
            <option value="volunteer">Volunteer enquiry</option>
            <option value="sponsorship">Sponsorship enquiry</option>
            <option value="donation">Donation enquiry</option>
        </select><br><br>

        <label for="reason">Reason for the Enquiry:</label><br>
        <textarea id="reason" name="reason" rows="5" placeholder="Enter the reason for the enquiry" required></textarea><br><br>

        <input type="submit" value="Submit the enquiry">
    </form>

    <hr>
    <footer>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Contact</a>
            <a href="enquiry.html">Enquiry</a>
        </nav>
    </footer>

</body>
</html>
