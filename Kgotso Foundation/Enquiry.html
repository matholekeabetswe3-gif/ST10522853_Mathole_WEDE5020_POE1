<!DOCTYPE html>
<html>
<head>
  <title>Kgotso Foundation - Enquiry</title>
</head>
<body>

  <h1>Enquiry Form</h1>
  <p>Please fill in the form below and we will get back to you.</p>

  <form>
    <label>Name:</label><br>
    <input type="text" placeholder="Enter their name"><br><br>

    <label>Email Address:</label><br>
    <input type="email" placeholder="Enter their email address"><br><br>

    <label>Phone Number:</label><br>
    <input type="tel" placeholder="Enter their phone number"><br><br>

    <label>Enquiry Type:</label><br>
    <select>
      <option>General enquiry</option>
      <option>Request for Support</option>
      <option>Volunteer enquiry</option>
      <option>Sponsorship enquiry</option>
      <option>Donation enquiry</option>
    </select><br><br>

    <label>Reason of the Enquiry:</label><br>
    <textarea placeholder="Enter the reason of the enquiry"></textarea><br><br>

    <input type="submit" value="Submit the enquiry">
  </form>

  <hr>
  <footer>
    <h3>Kgotso Foundation</h3>
    <p>Building a better community since 2022</p>
    <p>Phone: 012 597 8329 | Email: kgotsofoundation@gmail.com</p>
    <p>© 2025 Kgotso Foundation. All rights reserved.</p>
  </footer>

</body>
</html>
