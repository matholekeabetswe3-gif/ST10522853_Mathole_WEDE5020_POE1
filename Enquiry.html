<!DOCTYPE html>
<html>
<head>
  <title>Kgotso Foundation - enquiry</title>
   <link rel="stylesheet" href="styles.css"> 
</head>
<body style="background-color:bisque; font-family: Arial, sans-serif; margin: 0; padding: 0;">
<header class ="main header" style="background-color:pink; padding: 25px;">
  <div class="logo">
    <img src="Images/kgotso_logo.jpg" alt="Kgotso Foundation Logo" class="logo-img" style="width: 200px; height: auto; margin-bottom: 10px;">
    </div>
    <nav class="main-nav" style="display: flex; justify-content: right; gap: 20px;">
      <a href="index.html">home</a>
      <a href="about.html">about</a>
      <a href="services.html">services</a>
      <a href="contact.html">contact</a>
      <a href="enquiry.html">enquiry</a>
    </nav>
</header>
  <h1>Enquiry Form</h1>
  <p>Please fill in the form below and we will get back to you.</p>

  <form id="enquiry-form">
    <label>Name:</label><br>
    <input type="text" placeholder="Enter their name"><br><br>
    <small id="name-error">Please enter a valid name.</small><br>

    <label>Email Address:</label><br>
    <input type="email" placeholder="Enter their email address"><br><br>

    <label>Phone Number:</label><br>
    <input type="tel" placeholder="Enter their phone number"><br><br>

    <label>Enquiry Type:</label><br>
    <select>
      <option>General enquiry</option>
      <option>Request for Support</option>
      <option>Volunteer enquiry</option>
      <option>Sponsorship enquiry</option>
      <option>Donation enquiry</option>
    </select><br><br>

    <label>Reason of the Enquiry:</label><br>
    <textarea placeholder="Enter the reason of the enquiry"></textarea><br><br>

    <input type="submit" value="Submit the enquiry" >
    
  </form>

  <hr>

  <script
  src="javascript/validation.js"></script>
</body>
</html>
